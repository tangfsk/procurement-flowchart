<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>標準採購流程圖</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f1923;
  font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 30px 20px; color: #e0e8f0;
}
h1 { font-size: 1.6rem; font-weight: 700; color: #4fc3f7; margin-bottom: 6px; letter-spacing: 2px; }
.subtitle { font-size: 0.82rem; color: #607d8b; margin-bottom: 28px; }
.flowchart { display: flex; flex-direction: column; align-items: center; }
.row { display: flex; flex-direction: column; align-items: center; }
.step {
  display: flex; align-items: center; justify-content: center;
  width: 170px; height: 70px; border-radius: 12px;
  font-size: 0.85rem; font-weight: 600; text-align: center;
  line-height: 1.4; cursor: default; transition: transform 0.2s;
  position: relative; user-select: none; line-height: 1.35;
}
.step:hover { transform: scale(1.06); }
.step .label { white-space: pre-line; }
.t-start  { background: #152b20; border: 2px solid #4caf50; color: #a5d6a7; }
.t-proc   { background: #0f2535; border: 2px solid #2196f3; color: #90caf9; }
.t-approv { background: #1a0f2e; border: 2px solid #9c27b0; color: #ce93d8; }
.t-end    { background: #2a1010; border: 2px solid #f44336; color: #ef9a9a; }
.t-dec {
  width: 120px; height: 120px; transform: rotate(45deg);
  border-radius: 8px; background: #2a2210; border: 2px solid #ff9800;
  transition: transform 0.2s;
}
.t-dec:hover { transform: rotate(45deg) scale(1.08); }
.t-dec .inner {
  transform: rotate(-45deg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; width: 100%; height: 100%;
  color: #ffcc80;
}
.t-dec .inner .label { white-space: pre-line; font-size: 0.78rem; line-height: 1.3; }
.arrow { width: 2px; height: 30px; background: #29b6f6; position: relative; margin: 2px 0; }
.arrow::after {
  content: ''; position: absolute; bottom: -7px; left: 50%;
  transform: translateX(-50%);
  border-left: 6px solid transparent; border-right: 6px solid transparent;
  border-top: 9px solid #29b6f6;
}
.branch-wrap { display: flex; align-items: flex-start; gap: 50px; }
.branch-wrap .branch { display: flex; flex-direction: column; align-items: center; }
.branch-label { font-size: 0.78rem; font-weight: 700; margin-bottom: 4px; }
.legend {
  display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px;
  justify-content: center; padding: 12px 22px;
  background: rgba(255,255,255,0.04); border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
}
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #90a4ae; }
.legend-swatch { width: 14px; height: 14px; border-radius: 4px; border: 2px solid; }
.tooltip {
  position: fixed; background: #1e2d3d; border: 1px solid #4fc3f7;
  border-radius: 10px; padding: 10px 14px; font-size: 0.8rem;
  color: #cfd8dc; max-width: 220px; pointer-events: none;
  opacity: 0; transition: opacity 0.2s; z-index: 100;
  line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.tooltip.show { opacity: 1; }
@media (max-width: 600px) {
  .step { width: 140px; height: 60px; font-size: 0.78rem; }
  .t-dec { width: 90px; height: 90px; }
  .branch-wrap { gap: 24px; }
}
</style>
</head>
<body>
<h1>📦 標準採購流程圖</h1>
<div class="subtitle">STANDARD PROCUREMENT PROCESS</div>
<div class="flowchart" id="chart"></div>
<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#152b20;border-color:#4caf50"></div>開始/結束</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f2535;border-color:#2196f3"></div>一般流程</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#1a0f2e;border-color:#9c27b0"></div>審批節點</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#2a2210;border-color:#ff9800;transform:rotate(45deg);border-radius:2px;width:10px;height:10px"></div>決策判斷</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#2a1010;border-color:#f44336"></div>結束終點</div>
</div>
<div class="tooltip" id="tip"></div>
<script>
const steps = [
  {id:1,  type:'start',  label:'開始採購',       detail:'由需求部門或管理層發起採購需求，確定採購目的與範圍。'},
  {id:2,  type:'proc',   label:'識別需求\n規格制訂', detail:'明確採購品項、數量、規格、質量要求及交付時間。'},
  {id:3,  type:'proc',   label:'編寫採購\n申請單',  detail:'填寫採購申請表（PR），列明物品、數量、預算、用途等。'},
  {id:4,  type:'approv', label:'主管審批',        detail:'直屬主管審核需求合理性、預算是否符合計劃。'},
  {id:5,  type:'dec',    label:'預算\n充足？',    detail:'判斷申請金額是否在預算範圍內，決定後續流程走向。', yesTo:6, noTo:2},
  {id:6,  type:'proc',   label:'尋找供應商\n& 報價', detail:'向潛在供應商發出詢價（RFI/RFQ），收集報價與方案。'},
  {id:7,  type:'proc',   label:'供應商評估\n& 篩選', detail:'比較價格、質量、交期、服務、資質等因素，評估候選供應商。'},
  {id:8,  type:'dec',    label:'報價\n合適？',    detail:'評估收到的報價是否滿足需求，決定是否重新洽談或接受。', yesTo:9, noTo:6},
  {id:9,  type:'approv', label:'管理層\n最終審批',  detail:'高價值採購需管理層或財務審批，確認最終供應商與金額。'},
  {id:10, type:'proc',   label:'簽訂採購\n合同/訂單', detail:'與選定的供應商簽署採購訂單（PO）或正式採購合同。'},
  {id:11, type:'proc',   label:'跟進供應商\n備貨/生產', detail:'持續跟進訂單執行，監控生產進度或備貨情況。'},
  {id:12, type:'proc',   label:'發貨與\n物流運輸',   detail:'供應商安排發貨，選擇合適物流方式，跟蹤在途狀態。'},
  {id:13, type:'proc',   label:'收貨驗收\n& 質檢',  detail:'核對來貨與訂單是否一致，進行數量清點與質量檢驗。'},
  {id:14, type:'dec',    label:'驗收\n合格？',    detail:'檢驗結果是否符合質量標準，決定是否接受、退貨或索賠。', yesTo:15, noTo:13},
  {id:15, type:'proc',   label:'提交發票\n& 對帳',  detail:'收到供應商發票後，與訂單及驗收單進行核對確認。'},
  {id:16, type:'approv', label:'財務\n付款審批',    detail:'財務部門審核發票，確認付款金額、條件與帳期。'},
  {id:17, type:'proc',   label:'銀行轉帳\n付款',   detail:'按約定帳期（預付/貨到/月結等）完成款項支付。'},
  {id:18, type:'proc',   label:'記錄歸檔\n& 效果評估', detail:'將所有採購文件歸檔，評估供應商表現與採購效益。'},
  {id:19, type:'end',    label:'流程結束',        detail:'採購流程圓滿完成，資料存入系統供日後查閱與審計。'},
];
const c = document.getElementById('chart');
const tip = document.getElementById('tip');
function row() { const d=document.createElement('div'); d.className='row'; return d; }
function arrow() { const a=row(); a.className='arrow'; return a; }
function makeNode(step) {
  const el = document.createElement('div');
  el.className = 'step t-' + step.type;
  if (step.type === 'dec') {
    const inn = document.createElement('div'); inn.className='inner';
    const lb = document.createElement('div'); lb.className='label'; lb.textContent=step.label;
    inn.appendChild(lb); el.appendChild(inn);
  } else {
    const lb = document.createElement('div'); lb.className='label'; lb.textContent=step.label;
    el.appendChild(lb);
  }
  el.addEventListener('mouseenter',()=>{ tip.textContent=step.detail; tip.classList.add('show'); });
  el.addEventListener('mousemove',e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px'; });
  el.addEventListener('mouseleave',()=>tip.classList.remove('show'));
  return el;
}
steps.forEach((s,i)=>{
  if (s.type==='dec') {
    const wrap=row(); wrap.className='branch-wrap';
    // YES 欄
    const yesC=row(); yesC.className='branch';
    const yL=document.createElement('div'); yL.className='branch-label'; yL.style.color='#81c784';
    yL.textContent='✅ 是 → 步驟 '+s.yesTo;
    yesC.appendChild(yL); yesC.appendChild(arrow()); yesC.appendChild(makeNode(s));
    // NO 欄
    const noC=row(); noC.className='branch';
    const nL=document.createElement('div'); nL.className='branch-label'; nL.style.color='#ef9a9a';
    nL.textContent='❌ 否 → 返回步驟 '+s.noTo;
    noC.appendChild(nL); noC.appendChild(arrow());
    // NO 回饋路徑
    const noP=document.createElement('div');
    noP.style.cssText='display:flex;flex-direction:column;align-items:center;';
    const v1=document.createElement('div'); v1.style.cssText='width:2px;height:35px;background:#ef9a9a;';
    const h1=document.createElement('div'); h1.style.cssText='height:2px;width:70px;background:#ef9a9a;';
    const v2=document.createElement('div'); v2.style.cssText='width:2px;height:35px;background:#ef9a9a;';
    const tri=document.createElement('div');
    tri.style.cssText='border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid #ef9a9a;';
    noP.appendChild(v1); noP.appendChild(h1); noP.appendChild(v2); noP.appendChild(tri);
    noC.appendChild(noP);
    wrap.appendChild(yesC); wrap.appendChild(noC);
    c.appendChild(wrap);
  } else {
    const r=row(); r.appendChild(makeNode(s)); c.appendChild(r);
  }
  if (i < steps.length - 1) c.appendChild(arrow());
});
</script>
</body>
</html>
